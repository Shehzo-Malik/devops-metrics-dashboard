<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Metrics & Container Monitor - Shehzal Malik</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Header -->
        <header>
            <div class="header-title">
                <i class="fa-solid fa-server"></i>
                <div>
                    <h1>Cluster & Container Health</h1>
                    <p>Production Environment | Developed by Shehzal Malik</p>
                </div>
            </div>
            <button id="refresh-btn"><i class="fa-solid fa-rotate"></i> Refresh Metrics</button>
        </header>

        <!-- Metrics Cards -->
        <div class="metrics-grid">
            <div class="metric-card">
                <i class="fa-solid fa-microchip"></i>
                <div>
                    <span>CPU Usage</span>
                    <h3 id="cpu-metric">42%</h3>
                </div>
            </div>
            <div class="metric-card">
                <i class="fa-solid fa-memory"></i>
                <div>
                    <span>Memory Allocation</span>
                    <h3 id="memory-metric">6.4 GB / 8 GB</h3>
                </div>
            </div>
            <div class="metric-card">
                <i class="fa-solid fa-boxes-stacked"></i>
                <div>
                    <span>Active Containers</span>
                    <h3>5 Running</h3>
                </div>
            </div>
        </div>

        <!-- Containers Table Section -->
        <div class="table-section">
            <h2><i class="fa-solid fa-cube"></i> Docker Containers Status</h2>
            <table>
                <thead>
                    <tr>
                        <th>Container Name</th>
                        <th>Image</th>
                        <th>Port</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="container-list">
                    <!-- Dynamic rows via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
